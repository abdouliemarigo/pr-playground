<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 08: Missing Alt Text</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #0b0612;
      color: #eee;
      text-align: center;
    }
    header {
      background: #652d90;
      padding: 40px 20px;
    }
    main {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .logo {
      height: 56px;
      width: auto;
      margin: 24px 0;
    }
    p { color: #d4cbe0; }
  </style>
</head>
<body>
  <header>
    <h1>Accessibility Check</h1>
  </header>
  <main>
    <p>This logo needs meaningful alternative text.</p>
    <img class="logo" src="integify_logo.png" alt="Integify logo">
  </main>
</body>
</html>
