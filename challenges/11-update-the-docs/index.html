<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 11: Update the Docs</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #f7f3fb;
      color: #2a1a3a;
    }
    header {
      background: #652d90;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .card {
      background: #fff;
      border: 1px solid #e2d6ef;
      border-radius: 8px;
      padding: 20px;
      flex: 1;
      min-width: 200px;
    }
    .card h3 { color: #652d90; margin-top: 0; }
    .note {
      margin-top: 24px;
      color: #5a4a6a;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Integify Services</h1>
  </header>
  <main>
    <div class="cards">
      <div class="card">
        <h3>Web Development</h3>
        <p>Responsive, modern websites for growing teams.</p>
      </div>
      <div class="card">
        <h3>Mobile Apps</h3>
        <p>Cross-platform mobile applications that feel native.</p>
      </div>
      <div class="card">
        <h3>AI Integration</h3>
        <p>Practical AI features built into everyday products.</p>
      </div>
    </div>
    <p class="note">The docs in <code>SERVICES.md</code> should match these three services.</p>
  </main>
</body>
</html>
