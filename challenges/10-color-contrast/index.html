<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 10: Color Contrast</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #f3eafc;
      color: #d4b3ef;
      line-height: 1.6;
    }
    header {
      background: #652d90;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 {
      color: #652d90;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Readable by Design</h1>
  </header>
  <main>
    <h2>Why contrast matters</h2>
    <p>
      This paragraph should be easy to read for everyone, including people with
      low vision. Right now the text color is too light against the background.
      Fix the body text color so it has strong contrast.
    </p>
  </main>
</body>
</html>
