<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 04: Broken Button</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 100px;
      background: #f7f3fb;
      color: #2a1a3a;
    }
    button {
      font-size: 1.2rem;
      padding: 10px 20px;
      cursor: pointer;
      background: #652d90;
      color: #fff;
      border: none;
      border-radius: 8px;
    }
    button:hover { background: #7a3aad; }
    #message {
      margin-top: 20px;
      font-weight: bold;
      color: #652d90;
    }
  </style>
</head>
<body>
  <button id="clickMe">Click me</button>
  <p id="message"></p>

  <script src="js/app.js"></script>
</body>
</html>
